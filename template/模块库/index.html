<meta charset="UTF-8">

<title>模块库 - NavEditor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#3b82f6,#2563eb);padding:14px 32px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.header .hd-left{display:flex;align-items:center;gap:12px;flex:1}
.header h1{font-size:20px;font-weight:700;color:#fff}
.header p{font-size:12px;color:rgba(255,255,255,.7)}
.header .hd-actions{display:flex;gap:8px;flex-shrink:0}
.hd-btn{padding:7px 18px;font-size:13px;border-radius:7px;border:none;text-decoration:none;font-weight:500;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.hd-btn.tpl{background:#27ae60;color:#fff}.hd-btn.tpl:hover{background:#219a52}
.nav-bar{background:#fff;border-bottom:1px solid #e8ecf1;padding:0 32px;display:flex;gap:4px;flex-wrap:wrap}
.nav-chip{padding:10px 16px;font-size:13px;cursor:pointer;border:none;background:none;color:#888;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.nav-chip:hover{color:#3b82f6}
.nav-chip.active{color:#3b82f6;border-bottom-color:#3b82f6;font-weight:600}
.content{padding:20px 32px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;border:1px solid #e8ecf1;overflow:hidden;transition:box-shadow .2s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card:hover{box-shadow:0 4px 16px rgba(59,130,246,.1)}
.card-preview{height:120px;display:flex;align-items:center;justify-content:center;padding:16px;background:#f8fafc;border-bottom:1px solid #f2f4f7}
.card-body{padding:14px 16px}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card-name{font-size:14px;font-weight:600;color:#1a1a2e}
.card-role{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;flex-shrink:0}
.card-role.visitor{background:#e8f5e9;color:#27ae60}
.card-role.editor{background:#eff6ff;color:#3b82f6}
.card-desc{font-size:12px;color:#999;line-height:1.5;margin-bottom:8px}
.card-config{font-size:10px;color:#bbb;background:#fafbfc;padding:4px 8px;border-radius:4px;line-height:1.4}
@media(max-width:640px){.card-grid{grid-template-columns:1fr}.content{padding:14px 16px}.header{padding:12px 16px}.nav-bar{padding:0 16px}}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

var cats=[
  {id:'all',name:'全部',emoji:'📦'},
  {id:'input',name:'访客输入',emoji:'⌨️'},
  {id:'control',name:'交互控件',emoji:'🎮'},
  {id:'display',name:'内容展示',emoji:'📋'},
  {id:'layout',name:'布局结构',emoji:'📐'},
  {id:'func',name:'功能增强',emoji:'⚙️'}
];

var cur='all';
var navEl=document.getElementById('nav');
navEl.innerHTML=cats.map(function(c){return'<span class="nav-chip'+(c.id===cur?' active':'')+'" data-cat="'+c.id+'"><span>'+c.emoji+'</span>'+c.name+'</span>'}).join('');
navEl.addEventListener('click',function(e){var chip=e.target.closest('.nav-chip');if(!chip)return;cur=chip.getAttribute('data-cat');navEl.querySelectorAll('.nav-chip').forEach(function(c){c.classList.toggle('active',c.getAttribute('data-cat')===cur)});render()});

function render(){
  var list=cur==='all'?MODULES:MODULES.filter(function(m){return m.cat===cur});
  document.getElementById('content').innerHTML=list.map(function(m){
    return'<div class="card"><div class="card-preview">'+m.preview+'</div><div class="card-body"><div class="card-top"><span class="card-name">'+m.name+'</span><span class="card-role '+(m.role==='visitor'?'visitor':'editor')+'">'+m.roleText+'</span></div><div class="card-desc">'+m.desc+'</div><div class="card-config">'+m.config+'</div></div></div>';
  }).join('');
}
render();
