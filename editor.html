<head>

    <title>NavEditor</title>
    <link rel="icon" id="consoleFavicon">
    <link rel="stylesheet" href="assets/fontawesome-5.15.4/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=1787326818">
</head>
<body>
    <div id="app"></div>
    <script>
      // 单实例聚焦时携带 ?reload 参数，强制硬刷新以加载最新前端
      (function () {
        try {
          var p = new URLSearchParams(window.location.search);
          if (p.has('reload')) {
            window.history.replaceState({}, '', window.location.pathname);
            window.location.reload(true);
          }
        } catch (e) {}
      })();
    </script>
    <script src="lib/vue.global.js"></script>
    <script src="lib/jszip.min.js"></script>
    <script src="lib/xlsx.full.min.js"></script>

    <script src="template.js?v=1787326818"></script>
    <script src="app.js?v=1787326818"></script>
</body>
</html>
