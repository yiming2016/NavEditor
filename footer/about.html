<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title> 关于作者</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
body{background:#f5f7fa;padding:20px 0;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.about-container{max-width:900px;margin:50px auto;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);overflow:hidden}
.about-header{background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);color:#fff;padding:40px 30px;text-align:center}
.about-header h1{font-size:32px;margin:0 0 10px;font-weight:600}
.about-header p{font-size:16px;margin:0;opacity:.9}
.about-content{padding:40px 30px}
.section{margin-bottom:35px}
.section:last-child{margin-bottom:0}
.section-title{font-size:22px;color:#333;margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid #f0f0f0;display:flex;align-items:center}
.section-title i{margin-right:10px;color:#667eea}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:20px}
.skill-item{background:#f8f9fa;padding:15px;border-radius:6px;text-align:center;transition:transform .3s,box-shadow .3s}
.skill-item:hover{transform:translateY(-3px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.skill-item i{font-size:28px;color:#667eea;margin-bottom:8px}
.skill-item .skill-name{font-weight:600;color:#333;font-size:14px}
.contact-list{list-style:none;padding:0;margin:20px 0 0}
.contact-list li{padding:12px 15px;margin-bottom:10px;background:#f8f9fa;border-radius:6px;display:flex;align-items:center}
.contact-list li:hover{background:#e9ecef}
.contact-list li i{margin-right:12px;color:#667eea;width:20px;text-align:center}
.contact-list li strong{color:#333;margin-right:8px;min-width:80px}
.contact-list li a{color:#667eea;text-decoration:none;word-break:break-all}
.contact-list li a:hover{text-decoration:underline}
.section-rich-content{font-size:15px;line-height:1.8;color:#555}
.section-rich-content p{margin-bottom:15px}
.section-rich-content p:last-child{margin-bottom:0}
@media(max-width:768px){.about-container{margin:20px}.about-header{padding:30px 20px}.about-header h1{font-size:26px}.about-content{padding:30px 20px}.skills-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
</style>
</head>
<body>
<div class="about-container">
<div class="about-header">
<h1><i class="fas fa-user-circle"></i>  关于作者</h1>
<p>热爱技术，专注于软件开发与创新</p>
</div>
<div class="about-content">
<div class="section" data-sec="smsapxbp40"><h2 class="section-title"><i class="fas fa-star"></i> <span class="sec-title">新模板</span></h2></div><div class="section" data-sec="smsapxdwj1"><h2 class="section-title"><i class="fas fa-paper-plane"></i> <span class="sec-title">提交网站</span></h2><div class="ab-mod-blocks" data-mod-sec="smsapxdwj1"><div class="ab-mp-block ab-mp-span2"><div class="ab-mp-label"><b>网站名称</b></div><input class="ab-mp-input" type="text" placeholder="请输入网站名称" readonly></div><div class="ab-mp-block ab-mp-span2"><div class="ab-mp-label"><b>网站地址</b></div><input class="ab-mp-input" type="url" placeholder="https://example.com" readonly></div><div class="ab-mp-block ab-mp-span2"><div class="ab-mp-label"><b>网站分类</b></div><select class="ab-mp-select"><option>请选择...</option><option>科技</option><option>教育</option><option>娱乐</option><option>购物</option><option>工具</option><option>其他</option></select></div><div class="ab-mp-block ab-mp-span2"><div class="ab-mp-label"><b>语言</b></div><select class="ab-mp-select"><option>请选择...</option><option>中文</option><option>English</option><option>日本語</option></select></div><div class="ab-mp-block ab-mp-span4"><div class="ab-mp-label"><b>网站简介</b></div><textarea class="ab-mp-textarea" rows="4" readonly>请简要描述网站内容与特色...</textarea></div><div class="ab-mp-block ab-mp-span2"><div class="ab-mp-label"><b>联系邮箱</b></div><input class="ab-mp-input" type="email" placeholder="name@example.com" readonly></div><div class="ab-mp-block ab-mp-span2"><div class="ab-mp-label"><b>标签关键词</b></div><input class="ab-mp-input" type="text" placeholder="用逗号分隔多个关键词" readonly></div></div></div></div>
</div>
</body>
</html>
